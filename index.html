<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kulkarni General & Xerox</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #eaf4ff, #f7fbff);
  color: #17233b;
}

.card {
  width: min(100%, 480px);
  background: #ffffff;
  border-radius: 28px;
  padding: 28px 22px;
  box-shadow: 0 18px 55px rgba(15, 60, 110, 0.15);
  text-align: center;
}

.logo {
  width: 76px;
  height: 76px;
  border-radius: 20px;
  margin: 0 auto 14px;
  background: #0b63ce;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 29px;
  font-weight: 800;
}

h1 {
  font-size: 27px;
  margin: 5px 0 7px;
  color: #0b3f83;
}

.subtitle {
  margin: 0 0 22px;
  color: #68758a;
  font-size: 17px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 16px;
  margin: 12px 0;
  border-radius: 15px;
  text-decoration: none;
  font-size: 18px;
  font-weight: 700;
  color: #ffffff;
}

.pay {
  background: #0866d6;
}

.whatsapp {
  background: #1daa59;
}

.qrbox {
  margin: 24px auto 15px;
  padding: 18px;
  border-radius: 20px;
  background: #f3f7fc;
}

.qr-title {
  font-size: 18px;
  font-weight: 700;
  color: #0b3f83;
  margin-bottom: 12px;
}

.qrbox img {
  width: 100%;
  max-width: 310px;
  height: auto;
  background: #ffffff;
  padding: 10px;
  border-radius: 10px;
}

.info {
  margin-top: 15px;
  padding: 15px;
  border-radius: 15px;
  background: #f3f7fc;
  font-size: 14px;
  line-height: 1.7;
  color: #53627a;
}

.upi {
  font-weight: 700;
  color: #0b3f83;
  word-break: break-all;
}

.note {
  font-size: 12px;
  color: #8995a8;
  margin-top: 15px;
}
</style>
</head>

<body>

<main class="card">

  <div class="logo">KGX</div>

  <h1>Kulkarni General &amp; Xerox</h1>

  <p class="subtitle">
    Choose an option below
  </p>

  <!-- PAY NOW -->
  <a
    class="btn pay"
    href="upi://pay?pa=paytmqr6ewf1o@ptys&amp;pn=Paytm"
  >
    💳 &nbsp; Pay Now via UPI
  </a>

  <!-- WHATSAPP -->
  <a
    class="btn whatsapp"
    href="https://wa.me/919881817399"
    target="_blank"
    rel="noopener"
  >
    💬 &nbsp; Chat on WhatsApp
  </a>

  <!-- ORIGINAL QR -->
  <div class="qrbox">

    <div class="qr-title">
      Scan QR to Pay
    </div>

    <img
      src="paytm-qr.png"
      alt="Paytm UPI Payment QR"
    >

  </div>

  <!-- DETAILS -->
  <div class="info">

    <div>UPI ID</div>

    <div class="upi">
      paytmqr6ewf1o@ptys
    </div>

    <div style="margin-top:7px;">
      WhatsApp:
      <b>+91 9881817399</b>
    </div>

  </div>

  <div class="note">
    Pay securely using any UPI app.
  </div>

</main>

</body>
</html>
