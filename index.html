<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kulkarni General & Xerox</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    font-family: Arial, Helvetica, sans-serif;

    background: linear-gradient(
        135deg,
        #eaf4ff,
        #f7fbff
    );

    color: #17233b;
}

.card {
    width: min(100%, 480px);

    background: white;

    border-radius: 28px;

    padding: 30px 22px;

    text-align: center;

    box-shadow:
        0 18px 55px
        rgba(15,60,110,0.15);
}

.logo {
    width: 80px;
    height: 80px;

    margin: 0 auto 15px;

    border-radius: 20px;

    background: #0b63ce;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 28px;

    font-weight: bold;
}

h1 {
    margin: 5px 0 8px;

    font-size: 28px;

    color: #0b3f83;
}

.subtitle {
    margin-bottom: 25px;

    color: #68758a;

    font-size: 17px;
}


/* PAY BUTTON */

.pay-btn {

    width: 100%;

    padding: 17px;

    margin: 10px 0;

    border: none;

    border-radius: 16px;

    background: #0878d1;

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;
}


/* WHATSAPP BUTTON */

.whatsapp-btn {

    width: 100%;

    padding: 17px;

    margin: 10px 0;

    border: none;

    border-radius: 16px;

    background: #20b15a;

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;
}


/* UPI DETAILS */

.info {

    margin-top: 22px;

    padding: 17px;

    border-radius: 17px;

    background: #f3f7fc;

    color: #53627a;

    font-size: 14px;

    line-height: 1.7;
}

.upi {

    color: #0b3f83;

    font-size: 18px;

    font-weight: bold;

    word-break: break-all;
}


/* QR */

.qr-section {

    margin-top: 25px;

    padding: 18px;

    background: #f3f7fc;

    border-radius: 20px;
}

.qr-title {

    margin-bottom: 12px;

    color: #0b3f83;

    font-size: 18px;

    font-weight: bold;
}

.qr-section img {

    width: 100%;

    max-width: 300px;

    height: auto;

    padding: 8px;

    background: white;

    border-radius: 12px;
}

.qr-note {

    margin-top: 10px;

    color: #8995a8;

    font-size: 13px;
}

.footer {

    margin-top: 18px;

    color: #8995a8;

    font-size: 12px;
}

</style>

</head>


<body>


<div class="card">


    <div class="logo">
        KGX
    </div>


    <h1>
        Kulkarni General & Xerox
    </h1>


    <div class="subtitle">
        Payment & WhatsApp
    </div>



    <!-- PAY NOW -->

    <button
        class="pay-btn"
        onclick="payNow()">

        💳 Pay Now via UPI

    </button>



    <!-- WHATSAPP -->

    <button
        class="whatsapp-btn"
        onclick="openWhatsApp()">

        💬 Chat on WhatsApp

    </button>



    <!-- UPI INFORMATION -->

    <div class="info">

        <div>
            UPI ID
        </div>

        <div class="upi">
            paytmqr6ewf1o@ptys
        </div>

        <div style="margin-top:8px">

            WhatsApp:
            <b>
                +91 9881817399
            </b>

        </div>

    </div>



    <!-- ORIGINAL QR -->

    <div class="qr-section">

        <div class="qr-title">

            Scan QR to Pay

        </div>


        <img
            src="paytm-qr.png"
            alt="UPI Payment QR">


        <div class="qr-note">

            You can also scan this QR
            using any UPI app.

        </div>

    </div>



    <div class="footer">

        Secure UPI Payment

    </div>


</div>



<script>


function payNow() {

    /*
       Original Paytm QR ka
       exact UPI payment address
    */

    const upiLink =
        "upi://pay?pa=paytmqr6ewf1o@ptys&pn=Paytm";

    /*
       UPI application open karega
    */

    window.location.href = upiLink;

}



function openWhatsApp() {

    const phone =
        "919881817399";

    const message =
        "Hello Kulkarni General & Xerox";

    const whatsappLink =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);

    window.open(
        whatsappLink,
        "_blank"
    );

}


</script>


</body>

</html>
